age?", "options": ["Because a city body must also run the city’s police", "It has far more services to run, like water, roads and drains", "It does not. A Nagar Panchayat, as in a small town, is enough", "It does not. The State government looks after every street"], "answer": 1, "tags": {"2": "size-mixup", "0": "local-runs-country", "3": "capital-decides-all"}, "ncf": "C-8.3", "approved": false}, {"id": "ulsg-A-10", "v": 2, "concept": "functions", "idea": "What a city’s local body does", "kind": "reasoning", "stem": "Rahul’s baby sister was born last week in his city. Which body keeps the record of her birth?", "options": ["The Gram Sabha of a village nearby", "The State government in the capital", "The post office near her home", "The city’s Municipal Corporation"], "answer": 3, "tags": {"0": "village-body-in-city", "1": "capital-decides-all", "2": "body-jobs"}, "ncf": "C-8.3", "approved": false, "reason": {"v": 1, "prompt": "One more step: the reason. Why? Pick the reason that best explains your answer.", "options": ["Only the national government keeps birth records", "Recording births and deaths is a city body’s job", "Hospitals do it, so no public body is needed", "Births are recorded in the State capital alone"], "answer": 1, "tags": {"0": "capital-decides-all", "3": "capital-decides-all", "2": "body-jobs"}}}, {"id": "ulsg-A-11", "v": 3, "concept": "three_kinds", "idea": "Three kinds of town body, by size", "kind": "reasoning", "stem": "A village is becoming a town: shops and houses are taking the place of farms. Which body is made for a place like this?", "options": ["A Municipal Corporation", "A Zila Parishad", "A Municipal Council", "A Nagar Panchayat"], "answer": 3, "tags": {"0": "size-mixup", "1": "village-body-in-city", "2": "size-mixup"}, "ncf": "C-8.3", "approved": false, "reason": {"v": 1, "prompt": "One more step: the reason. Why? Pick the reason that best explains your answer.", "options": ["It is the body for the very largest cities", "It is meant f function trapFor(q, ch, isR, chap){ const own=isR?((q.reason||{}).tags||{}):(q.tags||{}); if(own[String(ch)]) return own[String(ch)];
  const T=TRAPS[chap]||{}, opt=(isR?q.reason.options:q.options)[ch]; return (T.marks||{})[opt]||null; }
 
function oldNoTag(q, a){ return !!(q&&a&&q.nt&&a.choice!=null&&(a.v||1)<(q.v||1)&&q.nt.includes(a.choice)); }
 
const RULES={version:'provisional, 18 Oct 2026; comparison off for January (26 Oct)', flagWrong:2, supportFlagged:4, supportRecallWrong:3, evidenceIdeas:3, comparison:false};
 
function scoreIdeas(sess){
  if(sess.sum) return JSON.parse(JSON.stringify(sess.sum));
  const set=SETS[sess.set], by={};
  set.questions.forEach(q=>{ const a=sess.answers[q.id], r=by[q.concept]||(by[q.concept]={idea:q.idea, right:0, wrong:0, missing:0, recall:null, use:[]});
    const ok=(a&&a.choice!=null)?(a.choice===q.answer):null;
    if(ok===null) r.missing++; else if(ok) r.right++; else r.wrong++;
    if(q.kind==='recall') r.recall=ok; else r.use.push(ok);
    if(q.reason){ r.reasonOk=(a&&a.reason!=null)?(a.reason===q.reason.answer):null; } });
  Object.values(by).forEach(r=>{
    r.status=r.missing?'evidence':(r.wrong>=RULES.flagWrong?'flagged':(r.wrong===1?'note':'ok'));
    r.need=r.status!=='flagged'?null:(r.recall===false?'fact':'use'); });
  return by;
}

function rateOf(pr){ if(!pr) return {}; if(pr.rate) return pr.rate; const r={}; if(pr.best) r[pr.best]='well'; if(pr.least) r[pr.least]='hard'; return r; }

function nextTest(sess, didWell, goingOver){
  const f=(SETS[sess.set]||{}).form, pre=sess.set.replace(/-[A-Z]$/,'-');
  if(f==='A'&&SETS[pre+'B']) return `<div class="card next"><b class="hi">Your next Disha: Disha 2, ${goingOver?'after you have gone over these topics':'in about a week'}</b><span>It has new questions on the same topics.${didWell?' You did really well, so please take it too: it shows how well your learning stays with you.':' It shows how your ideas have grown since today.'}</span></div>`;
  if(f==='B'&&SETS[pre+'C']) return `<div class="card next"><b class="hi">Your next Disha: Disha 3, in about a week</b><span>It has ${SETS[pre+'C'].questions.length} new questions on the same topics. No need to revise just before it: it shows what stays with you.</span></div>`;
  if(f==='C') return `<div class="card next"><b class="hi">That was your last Disha for this chapter</b><span>Thank you for taking all three!</span></div>`;
  return '';
}

function freshIdeas(sess, ids, goOver){
  const set=SETS[sess.set], Q=set.questions, held=(sess.plan&&sess.plan.later)||[], left=ids.filter(k=>!goOver.includes(k)&&!held.includes(k)), qs=k=>Q.filter(q=>q.concept===k);    
  const ans=q=>sess.answers[q.id]||{}, right=q=>ans(q).choice===q.answer;
  const all=Q.filter(q=>!ans(q).tip).map(q=>ans(q).ms||0).filter(Boolean), avg=all.length?all.reduce((a,b)=>a+b,0)/all.length:0;    
  const pre=sess.set.replace(/-[A-Z]$/,'-'), prevForm={B:'A',C:'B'}[set.form];
  const prev=prevForm?Object.values(DB.sessions).filter(x=>x.code===sess.code&&x.set===pre+prevForm&&x.finishedAt).pop():null;
  const before=prev&&prev.fresh?prev.fresh:[];
  const score=k=>{ const q=qs(k);
    const unsure=q.some(x=>right(x)&&ans(x).conf&&ans(x).conf!=='know');
    const reasonWrong=q.some(x=>x.reason&&ans(x).reason!=null&&ans(x).reason!==x.reason.answer);
    const qt=q.filter(x=>!ans(x).tip), t=qt.reduce((a,x)=>a+(ans(x).ms||0),0)/Math.max(1,qt.length);
    return {k, unsure, reasonWrong, slow:avg?t/avg:1, seen:before.includes(k)}; };
  const S=left.map(score).sort((a,b)=>(b.unsure-a.unsure)||(b.reasonWrong-a.reasonWrong)||(a.seen-b.seen)||(b.slow-a.slow));
  const pick=S.filter(x=>x.unsure||x.reasonWrong).slice(0,2);
  if(!goOver.length) S.filter(x=>!pick.includes(x)).slice(0,2-pick.length).forEach(x=>pick.push(x));    
  return pick.map(x=>({k:x.k, why:x.unsure?'you got it right, but you were not sure':x.reasonWrong?'your answers were right, but not the best reason':x.slow>1.15?'you took longest on it':'so it stays strong'}));
}

function makePlan(sess){
  const set=SETS[sess.set], ideas=scoreIdeas(sess), ids=Object.keys(ideas);
  const has=k=>!!(set.practice&&set.practice[k]);
  const flagged=ids.filter(k=>ideas[k].status==='flagged'), noEvidence=ids.filter(k=>ideas[k].status==='evidence');
  const recallWrong=ids.filter(k=>ideas[k].recall===false);
  const seed=(crypto.getRandomValues(new Uint32Array(1))[0]);
  let group, now=[], later=[], pick=null;
  if(noEvidence.length>=RULES.evidenceIdeas){ group='evidence'; now=flagged; }    
  else if(flagged.length>=RULES.supportFlagged || recallWrong.length>=RULES.supportRecallWrong){
    group='support'; now=[...new Set(flagged.concat(recallWrong))]; }    
  else if(RULES.comparison && flagged.length>=2 && flagged.every(has)){
    group='comparison'; pick=flagged[seed%flagged.length]; now=[pick]; later=flagged.filter(k=>k!==pick); }    
  else if(flagged.length>=2){ group='several'; now=flagged; }    
  else if(flagged.length>=1){ group='single'; now=flagged; }
  else group='none';
  return {rules:RULES, madeAt:now_(), ideas, group, now, later, pick, seed:(group==='comparison'?seed:null),
          noPractice:flagged.filter(k=>!has(k))};
}

  const k=set.replace(/-[A-Z]$/,'-A');

}

  document.querySelectorAll('.opt:not(.ropt):not(.popt):not(.sopt)').forEach(b=>b.onclick=()=>{ record({choice:+b.dataset.o}); addTime(); show(true); reveal(); });
  document.querySelectorAll('.ropt').forEach(b=>b.onclick=()=>{ record({reason:+b.dataset.r}); addTime(); show(true); reveal(); });
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ record({conf:b.dataset.f}); addTime(); show(true); reveal(); });
  on('#back',()=>{ addTime(); qi--; show(); });
  on('#next',()=>{ addTime(); tipDone(S().questions[qi]);
    if(fromCheck){ const Q=S().questions, nx=Q.findIndex(x=>!isDone(x)); if(nx>=0){ qi=nx; show(); } else { fromCheck=false; toEnd(); } return; }
    if(qi<S().questions.length-1){ qi++; show(); } else toEnd(); });
  on('#skip',()=>{ addTime(); const q=S().questions[qi]; const a=cur.answers[q.id]||(cur.answers[q.id]={choice:null,conf:null,ms:0,changes:0,v:q.v}); a.skips=(a.skips||0)+1; save();
    if(qi<S().questions.length-1){ qi++; show(); } else toEnd(); });    
  document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ addTime(); fromCheck=view==='check'; qi=+b.dataset.j; view='q'; show(); });    
  const saveWhy=(skip)=>{ const q=S().explain[0]; cur.explain[q]=skip?'':($('#why').value||'').trim(); cur.explainSkipped=!!skip; finishTest(); };
  on('#doneWhy',()=>saveWhy(false)); on('#skipWhy',()=>saveWhy(true));
   
  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{ const w=window.open(REPORTS_DIR+b.dataset.report,'_blank');
    const m=$('#reportMsg'); m.hidden=false; m.textContent=w?'Opening in a new tab…':'The browser blocked the new tab. Allow pop-ups for this page, or open the report from the reports folder and choose the saved answers file.'; });
   
  const ib=$('#importBtn'), inf=$('#importFile');
  if(ib&&inf){ ib.onclick=()=>inf.click(); inf.onchange=async()=>{ let added=0, same=0, updated=0, skipped=0;
    try{ for(const f of inf.files){ const ex=JSON.parse(await f.text()); if(ex.format!==FORMAT||!Array.isArray(ex.sessions)) throw new Error(f.name+' is not a Bodh answers file');
        ex.sessions.forEach(s=>{ if(!s||!s.id||!s.code||!SETS[s.set]){ skipped++; return; } const mine=DB.sessions[s.id];
          if(!mine){ DB.sessions[s.id]=s; added++; } else if((s.finishedAt||'')>(mine.finishedAt||'')||(!mine.finishedAt&&Object.keys(s.answers||{}).length>Object.keys(mine.answers||{}).length)){ DB.sessions[s.id]=s; updated++; } else same++; }); }
      save(); show(); const m=$('#importMsg'); m.hidden=false; m.innerHTML=`Added <b>${added}</b> test${added===1?'':'s'} from the other laptop${updated?`, brought ${updated} up to date`:''}${same?`; ${same} ${same===1?'was':'were'} already here`:''}${skipped?`; ${skipped} could not be read`:''}.`;
    }catch(e){ const m=$('#importMsg'); m.hidden=false; m.textContent='This file could not be added: '+e.message; } }; }
  on('#sendAll',()=>sendWaiting(true));
  on('#exportBtn',()=>{ const data=JSON.stringify(exportData(),null,1), name=`bodh-disha-answers-${new Date().toISOString().slice(0,10)}-${Object.keys(DB.sessions).length}tests.json`;
    try{ const url=URL.createObjectURL(new Blob([data],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
      const m=$('#exportMsg'); m.hidden=false; m.innerHTML=`Saved as <b>${esc(name)}</b> in the computer’s Downloads folder. If nothing appeared, use “Copy answers as text”.`; }catch(e){ const m=$('#exportMsg'); m.hidden=false; m.textContent='Saving a file did not work here. Use “Copy answers as text”.'; } });
  on('#copyBtn',()=>{ const t=$('#exportText'); t.hidden=false; t.value=JSON.stringify(exportData()); t.select();
    const m=$('#exportMsg'); m.hidden=false; (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{ m.textContent='Copied. Paste it into an email or a document for the teacher.'; },()=>{ m.textContent='Select all the text in the box and copy it (Ctrl+A, then Ctrl+C).'; }); });
  on('#siCode',()=>{ DB.signin='code'; save(); show(); }); on('#siName',()=>{ DB.signin='name'; save(); show(); });
  on('#delBtn',()=>{ if(($('#delConfirm').value||'').trim()==='DELETE'){ DB={sessions:{}, signin:DB.signin, wipedAt:now()}; save(); show(); } });
}
window.addEventListener('beforeunload',()=>addTime());
 
window.addEventListener('storage',e=>{ if(e.key!==KEY) return; try{ const d=JSON.parse(e.newValue||'{}');
  Object.entries(d.sessions||{}).forEach(([id,x])=>{ if((DB.deleted||[]).includes(id)) return; const m=DB.sessions[id], w=newerOf(m,x); if(w!==m) DB.sessions[id]=w; });
  (d.deleted||[]).forEach(id=>{ if(cur&&cur.id===id) return; delete DB.sessions[id]; (DB.deleted=DB.deleted||[]).includes(id)||DB.deleted.push(id); }); }catch(err){} });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) addTime(); else shownAt=Date.now(); });
show();
if(FROM_BODH) Object.keys(DB.sessions).forEach(slim);    
window.addEventListener('online',()=>sendWaiting()); setTimeout(()=>sendWaiting(),1500); setInterval(()=>sendWaiting(),60000);    
</script>
